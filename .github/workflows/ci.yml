name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 6AM

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Lint/type tools pinned to the versions this commit was verified with
          pip install ruff==0.16.9 mypy==2.3.1

      - name: Lint and format check with Ruff
        run: |
          ruff check . --exclude frontend,venv,.venv
          ruff format --check . --exclude frontend,venv,.venv

      - name: Type check with mypy
        run: |
          mypy api agents config database models notifications scrapers utils \
            --ignore-missing-imports --no-strict-optional

      - name: Run unit & regression test suite
        run: |
          cp .env.example .env
          python -m pytest tests/ -v -m "not integration and not property_based" \
            --cov=. --cov-report=term-missing --cov-report=xml --timeout=120

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend unit tests (Vitest)
        working-directory: ./frontend
        run: npx vitest run

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Docker image (dry run, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dedan-remote:ci-test
          cache-from: type=gha

          cache-to: type=gha,mode=max