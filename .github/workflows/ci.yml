# ─────────────────────────────────────────────────────────────────────────────
# AI Opportunity Discovery System — GitHub Actions CI Pipeline
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 6AM

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy black flake8 isort

      - name: Check formatting with Black
        run: black --check . --diff

      - name: Lint with Flake8
        run: |
          flake8 . --count --statistics --show-source \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=.venv,venv,__pycache__,build,dist

      - name: Sort imports with isort
        run: isort --check-only --diff .

      - name: Type check with mypy
        run: |
          mypy . --ignore-missing-imports --warn-unused-ignores \
            || echo "mypy warnings found (non-blocking)"

      - name: Run tests with coverage
        run: |
          cp .env.example .env
          python -m pytest tests/ -v --cov=. --cov-report=term-missing \
            --cov-report=xml --timeout=30 -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-opportunity-finder:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-opportunity-finder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max