<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fbf7f0"/>
<title>Applications — DEDAN Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{
  fontFamily:{ sans:['Inter','ui-sans-serif','system-ui','sans-serif'], serif:['"Instrument Serif"','ui-serif','Georgia','serif'] },
  colors:{
    ivory:{50:'#FDFBF6',100:'#FBF7F0',200:'#F6EFE2',DEFAULT:'#FBF7F0'},
    cream:{DEFAULT:'#F3ECDF',dark:'#EBE2D0'},
    cocoa:{100:'#E9DFCF',200:'#D7C9B1',300:'#B8A488',400:'#8E7A5E',500:'#6C5A42',600:'#514330',700:'#3A2F22',800:'#261E14',900:'#17110B',DEFAULT:'#514330'},
    espresso:{50:'#342A1E',100:'#2A2117',200:'#231C14',300:'#1C1610',400:'#16110C',500:'#110D09',DEFAULT:'#1C1610'},
    champagne:{50:'#FBF0DA',100:'#F5E3BA',200:'#EBD194',300:'#DDB767',400:'#C89A47',500:'#A87F36',DEFAULT:'#C89A47'},
    gold:{500:'#B08A3E',600:'#96722C',DEFAULT:'#B08A3E'},
    success:{DEFAULT:'#2F6D51',soft:'#E6F0EA'},
    warning:{DEFAULT:'#A87016',soft:'#F7EAD2'},
    danger:{DEFAULT:'#992F2A',soft:'#F4DAD9'},
    info:{DEFAULT:'#275E8C',soft:'#DCE8F2'},
    ink:'#110D09'
  },
  boxShadow:{ soft:'0 1px 2px rgba(23,17,11,.04), 0 1px 3px rgba(23,17,11,.04)', card:'0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04)', lift:'0 8px 24px -12px rgba(23,17,11,.18), 0 2px 6px rgba(23,17,11,.05)' }
}}};
</script>
<style>
  :root { color-scheme: light; }
  html,body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  body { background:#FBF7F0; color:#17110B; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  ::selection { background:#DDB767; color:#1C1610; }
  .material-symbols-rounded { font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20; line-height:1; }
  .grid-12 { max-width:1520px; margin-inline:auto; padding-inline:20px; }
  @media (min-width:1280px){ .grid-12{ padding-inline:28px; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 12px; border-radius:9px; font-weight:600; font-size:13px; line-height:1.2; border:1px solid rgba(81,67,48,.12); background:#fff; color:#1C1610; cursor:pointer; transition:all .14s ease; text-decoration:none; }
  .btn:hover { background:#FBF7F0; }
  .btn-primary { background:#1C1610; color:#FBF7F0; border-color:transparent; }
  .btn-primary:hover { background:#231C14; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04), inset 0 0 0 1px rgba(81,67,48,.08); }
  .nav-link { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:#514330; font-weight:500; font-size:13.5px; transition:all .15s ease; cursor:pointer; text-decoration:none; }
  .nav-link:hover { background:#F3ECDF; color:#1C1610; }
  .nav-link.is-active { background:#fff; color:#1C1610; box-shadow:inset 0 0 0 1px rgba(81,67,48,.10), 0 1px 2px rgba(23,17,11,.04); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:9999px; font-size:11.5px; font-weight:600; line-height:1.3; }
  .chip-saved { background:#F3ECDF; color:#514330; }
  .chip-applied { background:#DCE8F2; color:#275E8C; }
  .chip-interviewing { background:#F7EAD2; color:#A87016; }
  .chip-offer { background:#E6F0EA; color:#2F6D51; }
  .chip-rejected { background:#F4DAD9; color:#992F2A; }
  .field { width:100%; padding:8px 11px; border-radius:9px; border:1px solid rgba(81,67,48,.16); background:#fff; font-size:13px; color:#1C1610; transition:all .15s ease; }
  .field:focus { outline:none; box-shadow:0 0 0 4px rgba(200,154,71,.16); border-color:#C89A47; }
  .hairline { box-shadow: inset 0 0 0 1px rgba(81,67,48,.08); }
  .skel { background:linear-gradient(90deg,#F3ECDF 0%, #FBF7F0 50%, #F3ECDF 100%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .focus-ring:focus-visible { outline:2px solid #C89A47; outline-offset:3px; border-radius:10px; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translate(-50%,14px); background:#1C1610; color:#FBF7F0; padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:600; z-index:90; opacity:0; pointer-events:none; transition:all .22s ease; box-shadow:0 10px 30px rgba(23,17,11,.35); }
  .toast.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css"/>
</head>
<body class="min-h-screen bg-ivory text-ink antialiased" data-app-header data-active="applications">
<main class="grid-12 py-7" data-authed>
  <div class="flex items-end justify-between mb-6 gap-4">
    <div>
      <h1 class="text-[24px] md:text-[28px] font-extrabold tracking-tight text-espresso-300">Applications</h1>
      <p class="text-[13.5px] text-cocoa-500 mt-0.5">Track every role through your pipeline.</p>
    </div>
  </div>

  <div class="card overflow-hidden">
    <div class="hidden md:grid grid-cols-12 gap-3 px-5 py-3 border-b border-cocoa-200/50 text-[11px] uppercase tracking-wider font-semibold text-cocoa-400">
      <div class="col-span-5">Role</div>
      <div class="col-span-3">Company</div>
      <div class="col-span-2">Status</div>
      <div class="col-span-2 text-right">Updated</div>
    </div>
    <div id="apps-list" class="divide-y divide-cocoa-200/40">
      <div class="skel h-14 m-4"></div><div class="skel h-14 m-4"></div>
    </div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-text">Updated.</span></div>

<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
(function () {
  if (!API.isSignedIn()) { location.replace('signin.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
  const $ = (id) => document.getElementById(id);
  const list = $('apps-list');
  const STATUSES = ['saved', 'applied', 'interviewing', 'offer', 'rejected'];

  function esc(v){ return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function when(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  function render(rows) {
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="p-10 text-center"><span class="material-symbols-rounded text-cocoa-300" style="font-size:40px;">work_outline</span><p class="text-[14px] font-semibold text-espresso-300 mt-2">No applications yet</p><p class="text-[13px] text-cocoa-400 mt-1">Save a role and move it into your application tracker.</p><a href="opportunities.html" class="btn btn-primary mt-4">Explore opportunities</a></div>';
      return;
    }
    rows.forEach(app => {
      const job = app.job || {};
      const row = document.createElement('div');
      row.className = 'grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-3 px-5 py-3.5 items-center hover:bg-cream/50 transition-colors';
      const id = job.id || job.slug;
      row.innerHTML =
        '<div class="md:col-span-5 min-w-0">' +
          '<a href="job-detail.html?id=' + encodeURIComponent(id) + '" class="text-[13.5px] font-bold text-espresso-300 hover:text-champagne-500 truncate block">' + esc(job.title || 'Untitled') + '</a>' +
        '</div>' +
        '<div class="md:col-span-3 text-[13px] text-cocoa-500 truncate">' + esc(job.company || '') + '</div>' +
        '<div class="md:col-span-2"><select class="field status-select" data-id="' + esc(app.id) + '">' +
          STATUSES.map(s => '<option value="' + s + '"' + (app.status === s ? ' selected' : '') + '>' + esc(s.charAt(0).toUpperCase()+s.slice(1)) + '</option>').join('') +
        '</select></div>' +
        '<div class="md:col-span-2 text-right text-[12.5px] text-cocoa-400">' + esc(when(app.updated_at || app.created_at)) + '</div>';
      list.appendChild(row);
    });
    list.querySelectorAll('.status-select').forEach(sel => sel.addEventListener('change', async () => {
      const id = sel.getAttribute('data-id');
      try { await API.patchApplication(id, { status: sel.value }); toast('Status updated to "' + sel.value + '".'); }
      catch (e) { toast(e.message || 'Could not update status.'); API.applications().then(render).catch(()=>{}); }
    }));
  }

  API.applications().then(render).catch(() => {
    list.innerHTML = '<div class="p-10 text-center text-[13.5px] text-cocoa-500">Could not load applications. Please try again.</div>';
  });
})();
</script>
<script src="nav.js"></script>
</body>
</html>
