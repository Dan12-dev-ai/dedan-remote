<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the master logo's background plate, so the browser chrome blends
         with the brand instead of framing it in an unrelated grey. -->
    <meta name="theme-color" content="#0d162d" />
    <title>DEDAN Remote — Intelligent Global Opportunity Discovery</title>
    <meta
      name="description"
      content="AI-powered discovery of remote work, AI training, data, software and digital opportunities from monitored sources worldwide."
    />
    <meta property="og:title" content="DEDAN Remote" />
    <meta
      property="og:description"
      content="Discover work that finds you — intelligent global opportunity discovery."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/dedan-remote-lockup.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="209" />
    <meta property="og:image:alt" content="DEDAN Remote" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The mark appears in the navigation on every route, so it is fetched at
         the highest priority rather than after the JS bundle resolves it. -->
    <link rel="preload" as="image" href="/brand/dedan-remote-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
