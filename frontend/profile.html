<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fbf7f0"/>
<title>Profile & Preferences — DEDAN Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{
  fontFamily:{ sans:['Inter','ui-sans-serif','system-ui','sans-serif'], serif:['"Instrument Serif"','ui-serif','Georgia','serif'] },
  colors:{
    ivory:{50:'#FDFBF6',100:'#FBF7F0',200:'#F6EFE2',DEFAULT:'#FBF7F0'},
    cream:{DEFAULT:'#F3ECDF',dark:'#EBE2D0'},
    cocoa:{100:'#E9DFCF',200:'#D7C9B1',300:'#B8A488',400:'#8E7A5E',500:'#6C5A42',600:'#514330',700:'#3A2F22',800:'#261E14',900:'#17110B',DEFAULT:'#514330'},
    espresso:{50:'#342A1E',100:'#2A2117',200:'#231C14',300:'#1C1610',400:'#16110C',500:'#110D09',DEFAULT:'#1C1610'},
    champagne:{50:'#FBF0DA',100:'#F5E3BA',200:'#EBD194',300:'#DDB767',400:'#C89A47',500:'#A87F36',DEFAULT:'#C89A47'},
    gold:{500:'#B08A3E',600:'#96722C',DEFAULT:'#B08A3E'},
    success:{DEFAULT:'#2F6D51',soft:'#E6F0EA'},
    warning:{DEFAULT:'#A87016',soft:'#F7EAD2'},
    danger:{DEFAULT:'#992F2A',soft:'#F4DAD9'},
    info:{DEFAULT:'#275E8C',soft:'#DCE8F2'},
    ink:'#110D09'
  },
  boxShadow:{ soft:'0 1px 2px rgba(23,17,11,.04), 0 1px 3px rgba(23,17,11,.04)', card:'0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04)', lift:'0 8px 24px -12px rgba(23,17,11,.18), 0 2px 6px rgba(23,17,11,.05)' }
}}};
</script>
<style>
  :root { color-scheme: light; }
  html,body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  body { background:#FBF7F0; color:#17110B; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  ::selection { background:#DDB767; color:#1C1610; }
  .material-symbols-rounded { font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20; line-height:1; }
  .grid-12 { max-width:1520px; margin-inline:auto; padding-inline:20px; }
  @media (min-width:1280px){ .grid-12{ padding-inline:28px; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; line-height:1.2; border:1px solid rgba(81,67,48,.12); background:#fff; color:#1C1610; cursor:pointer; transition:all .14s ease; text-decoration:none; }
  .btn:hover { background:#FBF7F0; }
  .btn-primary { background:#1C1610; color:#FBF7F0; border-color:transparent; }
  .btn-primary:hover { background:#231C14; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04), inset 0 0 0 1px rgba(81,67,48,.08); }
  .nav-link { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:#514330; font-weight:500; font-size:13.5px; transition:all .15s ease; cursor:pointer; text-decoration:none; }
  .nav-link:hover { background:#F3ECDF; color:#1C1610; }
  .nav-link.is-active { background:#fff; color:#1C1610; box-shadow:inset 0 0 0 1px rgba(81,67,48,.10), 0 1px 2px rgba(23,17,11,.04); }
  .field { width:100%; padding:10px 12px; border-radius:9px; border:1px solid rgba(81,67,48,.16); background:#fff; font-size:14px; color:#1C1610; transition:all .15s ease; }
  .field:focus { outline:none; box-shadow:0 0 0 4px rgba(200,154,71,.16); border-color:#C89A47; }
  .toggle { position:relative; display:inline-flex; align-items:center; cursor:pointer; }
  .toggle input { position:absolute; opacity:0; width:0; height:0; }
  .toggle .track { width:38px; height:22px; border-radius:9999px; background:#D7C9B1; transition:background .18s ease; position:relative; }
  .toggle .track::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:9999px; background:#fff; transition:transform .18s ease; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .toggle input:checked + .track { background:#2F6D51; }
  .toggle input:checked + .track::after { transform:translateX(16px); }
  .toggle input:focus-visible + .track { box-shadow:0 0 0 4px rgba(200,154,71,.2); }
  .hairline { box-shadow: inset 0 0 0 1px rgba(81,67,48,.08); }
  .focus-ring:focus-visible { outline:2px solid #C89A47; outline-offset:3px; border-radius:10px; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translate(-50%,14px); background:#1C1610; color:#FBF7F0; padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:600; z-index:90; opacity:0; pointer-events:none; transition:all .22s ease; box-shadow:0 10px 30px rgba(23,17,11,.35); }
  .toast.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{ transition-duration:.01ms !important; } }
</style>
</head>
<body class="min-h-screen bg-ivory text-ink antialiased" data-app-header data-active="profile">
<main class="grid-12 py-7" data-authed>
  <div class="mb-6">
    <h1 class="text-[24px] md:text-[28px] font-extrabold tracking-tight text-espresso-300">Profile & preferences</h1>
    <p class="text-[13.5px] text-cocoa-500 mt-0.5">Calibrate what DEDAN surfaces for you. Changes apply to recommendations immediately.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Account -->
    <div class="card p-5 lg:col-span-1">
      <h2 class="text-[15px] font-bold text-espresso-300 mb-4 flex items-center gap-2"><span class="material-symbols-rounded text-champagne-500" style="font-size:19px;">account_circle</span>Account</h2>
      <label class="block text-[12.5px] font-semibold text-espresso-300 mb-1.5" for="display-name">Display name</label>
      <input id="display-name" type="text" class="field mb-4" maxlength="80" placeholder="Your name"/>
      <div class="text-[12px] text-cocoa-400 mb-1">Email</div>
      <div id="email" class="text-[13px] font-semibold text-espresso-300 mb-4">—</div>
      <div class="text-[12px] text-cocoa-400 mb-1">Member since</div>
      <div id="created" class="text-[13px] font-semibold text-espresso-300">—</div>
    </div>

    <!-- Preferences -->
    <div class="card p-5 lg:col-span-2">
      <h2 class="text-[15px] font-bold text-espresso-300 mb-4 flex items-center gap-2"><span class="material-symbols-rounded text-champagne-500" style="font-size:19px;">tune</span>Discovery preferences</h2>

      <label class="block text-[12.5px] font-semibold text-espresso-300 mb-1.5" for="experience">Experience level</label>
      <select id="experience" class="field mb-4">
        <option value="">Not specified</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>

      <label class="block text-[12.5px] font-semibold text-espresso-300 mb-1.5" for="regions">Preferred regions <span class="font-normal text-cocoa-400">(comma-separated)</span></label>
      <input id="regions" type="text" class="field mb-1" placeholder="e.g. Worldwide, Africa, US"/>
      <p class="text-[11.5px] text-cocoa-400 mb-4">Controls eligibility filtering in recommendations.</p>

      <label class="block text-[12.5px] font-semibold text-espresso-300 mb-1.5" for="categories">Skill categories <span class="font-normal text-cocoa-400">(comma-separated)</span></label>
      <input id="categories" type="text" class="field mb-1" placeholder="e.g. python, data annotation, ai"/>
      <p class="text-[11.5px] text-cocoa-400 mb-5">Up to 20 tags used to rank matches toward your stack.</p>

      <div class="flex items-center gap-3">
        <button id="save-btn" class="btn btn-primary"><span class="material-symbols-rounded" style="font-size:18px;">save</span>Save changes</button>
        <span id="save-status" class="text-[12.5px] text-cocoa-400"></span>
      </div>
    </div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-text">Saved.</span></div>

<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
(function () {
  if (!API.isSignedIn()) { location.replace('signin.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
  const $ = (id) => document.getElementById(id);

  function fillList(v) {
    if (Array.isArray(v)) return v.join(', ');
    return v ? String(v) : '';
  }
  function splitList(v) {
    return String(v || '').split(',').map(s => s.trim()).filter(Boolean);
  }

  API.profile().then(p => {
    $('display-name').value = p.user.display_name || '';
    $('email').textContent = p.user.email || '—';
    $('created').textContent = p.user.created_at ? new Date(p.user.created_at).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) : '—';
    $('experience').value = p.preferences.experience || '';
    $('regions').value = fillList(p.preferences.regions);
    $('categories').value = fillList(p.preferences.categories);
  }).catch(() => { toast('Could not load your profile.'); });

  $('save-btn').addEventListener('click', async () => {
    const btn = $('save-btn');
    btn.disabled = true; $('save-status').textContent = 'Saving…';
    try {
      const patch = {
        display_name: $('display-name').value.trim() || null,
        experience: $('experience').value || null,
        regions: splitList($('regions').value),
        categories: splitList($('categories').value),
      };
      await API.patchProfile(patch);
      $('save-status').textContent = 'Saved just now.';
      toast('Preferences saved.');
    } catch (e) {
      $('save-status').textContent = '';
      toast(e.message || 'Could not save. Please try again.');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
<script src="nav.js"></script>
</body>
</html>
