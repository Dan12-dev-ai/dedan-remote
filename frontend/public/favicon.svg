<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DEDAN Remote">
  <title>DEDAN Remote</title>
  <defs>
    <linearGradient id="dedan-d" x1="10" y1="5" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CFDFF"/>
      <stop offset=".34" stop-color="#218CF7"/>
      <stop offset=".66" stop-color="#1B57EF"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="dedan-orbit" x1="2" y1="42" x2="50" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A7BF6" stop-opacity=".2"/>
      <stop offset=".38" stop-color="#6BEAFF"/>
      <stop offset="1" stop-color="#3CFDFF" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#01081A"/>

  <!-- Orbit ring sweeping behind the letterform -->
  <ellipse cx="27" cy="35" rx="22" ry="8.5" transform="rotate(-19 27 35)"
           fill="none" stroke="url(#dedan-orbit)" stroke-width="2.2"/>

  <!-- The "D": flat stem, deeply rounded bowl, rectangular counter -->
  <path fill="url(#dedan-d)" fill-rule="evenodd"
        d="M13 7h17.5C42.5 7 53 15.6 53 31.5S42.5 56 30.5 56H13V7Zm11.5 13v23h5.5c5.6 0 9.2-4.3 9.2-11.5S35.6 20 30 20h-5.5Z"/>

  <!-- Dark diagonal band where the ring passes in front of the bowl -->
  <path d="M4.5 40.5 52 14" stroke="#01081A" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <path d="M6.5 39.5 51 14.6" stroke="url(#dedan-orbit)" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Ascent arrow -->
  <path fill="url(#dedan-d)" d="M61 5.5 40.8 16.2l8.4 2.6 2.4 8.6L61 5.5Z"/>
</svg>
