<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fbf7f0"/>
<title>Saved — DEDAN Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{
  fontFamily:{ sans:['Inter','ui-sans-serif','system-ui','sans-serif'], serif:['"Instrument Serif"','ui-serif','Georgia','serif'] },
  colors:{
    ivory:{50:'#FDFBF6',100:'#FBF7F0',200:'#F6EFE2',DEFAULT:'#FBF7F0'},
    cream:{DEFAULT:'#F3ECDF',dark:'#EBE2D0'},
    cocoa:{100:'#E9DFCF',200:'#D7C9B1',300:'#B8A488',400:'#8E7A5E',500:'#6C5A42',600:'#514330',700:'#3A2F22',800:'#261E14',900:'#17110B',DEFAULT:'#514330'},
    espresso:{50:'#342A1E',100:'#2A2117',200:'#231C14',300:'#1C1610',400:'#16110C',500:'#110D09',DEFAULT:'#1C1610'},
    champagne:{50:'#FBF0DA',100:'#F5E3BA',200:'#EBD194',300:'#DDB767',400:'#C89A47',500:'#A87F36',DEFAULT:'#C89A47'},
    gold:{500:'#B08A3E',600:'#96722C',DEFAULT:'#B08A3E'},
    success:{DEFAULT:'#2F6D51',soft:'#E6F0EA'},
    warning:{DEFAULT:'#A87016',soft:'#F7EAD2'},
    danger:{DEFAULT:'#992F2A',soft:'#F4DAD9'},
    info:{DEFAULT:'#275E8C',soft:'#DCE8F2'},
    ink:'#110D09'
  },
  boxShadow:{ soft:'0 1px 2px rgba(23,17,11,.04), 0 1px 3px rgba(23,17,11,.04)', card:'0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04)', lift:'0 8px 24px -12px rgba(23,17,11,.18), 0 2px 6px rgba(23,17,11,.05)' }
}}};
</script>
<style>
  :root { color-scheme: light; }
  html,body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  body { background:#FBF7F0; color:#17110B; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  ::selection { background:#DDB767; color:#1C1610; }
  .material-symbols-rounded { font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20; line-height:1; }
  .grid-12 { max-width:1520px; margin-inline:auto; padding-inline:20px; }
  @media (min-width:1280px){ .grid-12{ padding-inline:28px; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; line-height:1.2; border:1px solid rgba(81,67,48,.12); background:#fff; color:#1C1610; cursor:pointer; transition:all .14s ease; text-decoration:none; }
  .btn:hover { background:#FBF7F0; }
  .btn-primary { background:#1C1610; color:#FBF7F0; border-color:transparent; }
  .btn-primary:hover { background:#231C14; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; background:transparent; color:#514330; border:1px solid transparent; cursor:pointer; transition:all .14s ease; }
  .icon-btn:hover { background:#F3ECDF; color:#1C1610; }
  .icon-btn.is-saved { color:#A87F36; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 2px rgba(23,17,11,.05), 0 2px 6px rgba(23,17,11,.04), inset 0 0 0 1px rgba(81,67,48,.08); transition:all .2s ease; }
  .card:hover { box-shadow:0 10px 28px -14px rgba(23,17,11,.20), inset 0 0 0 1px rgba(200,154,71,.35); }
  .nav-link { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:#514330; font-weight:500; font-size:13.5px; transition:all .15s ease; cursor:pointer; text-decoration:none; }
  .nav-link:hover { background:#F3ECDF; color:#1C1610; }
  .nav-link.is-active { background:#fff; color:#1C1610; box-shadow:inset 0 0 0 1px rgba(81,67,48,.10), 0 1px 2px rgba(23,17,11,.04); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:9999px; font-size:11.5px; font-weight:600; line-height:1.3; background:#F3ECDF; color:#514330; }
  .hairline { box-shadow: inset 0 0 0 1px rgba(81,67,48,.08); }
  .skel { background:linear-gradient(90deg,#F3ECDF 0%, #FBF7F0 50%, #F3ECDF 100%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .focus-ring:focus-visible { outline:2px solid #C89A47; outline-offset:3px; border-radius:10px; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translate(-50%,14px); background:#1C1610; color:#FBF7F0; padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:600; z-index:90; opacity:0; pointer-events:none; transition:all .22s ease; box-shadow:0 10px 30px rgba(23,17,11,.35); }
  .toast.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body class="min-h-screen bg-ivory text-ink antialiased" data-app-header>
<!-- header is injected by chrome.js -->
<main class="grid-12 py-7" data-authed>
  <div class="flex items-end justify-between mb-6 gap-4">
    <div>
      <h1 class="text-[24px] md:text-[28px] font-extrabold tracking-tight text-espresso-300">Saved pipeline</h1>
      <p class="text-[13.5px] text-cocoa-500 mt-0.5">Roles you bookmarked to revisit.</p>
    </div>
    <a href="opportunities.html" class="btn btn-primary"><span class="material-symbols-rounded" style="font-size:18px;">explore</span>Explore more</a>
  </div>

  <div id="saved-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
    <div class="skel h-32"></div><div class="skel h-32"></div><div class="skel h-32"></div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-text">Removed from saved.</span></div>

<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
(function () {
  if (!API.isSignedIn()) { location.replace('signin.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
  const $ = (id) => document.getElementById(id);
  const list = $('saved-list');

  function esc(v){ return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function render(rows) {
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="md:col-span-2 xl:col-span-3 card p-10 text-center"><span class="material-symbols-rounded text-cocoa-300" style="font-size:40px;">bookmark_border</span><p class="text-[14px] font-semibold text-espresso-300 mt-2">No saved roles yet</p><p class="text-[13px] text-cocoa-400 mt-1">Browse the catalog and bookmark roles to build your pipeline.</p><a href="opportunities.html" class="btn btn-primary mt-4">Explore opportunities</a></div>';
      return;
    }
    rows.forEach(row => {
      const job = row.job || row;
      const id = job.id || job.slug;
      const card = document.createElement('div');
      card.className = 'card p-4 flex flex-col gap-3';
      card.innerHTML =
        '<div class="flex items-start gap-3">' +
          '<div class="w-10 h-10 rounded-lg bg-cream grid place-items-center text-espresso-300 text-[13px] font-bold shrink-0">' + esc((job.company||'?').slice(0,2).toUpperCase()) + '</div>' +
          '<div class="min-w-0 flex-1">' +
            '<a href="job-detail.html?id=' + encodeURIComponent(id) + '" class="text-[14px] font-bold text-espresso-300 hover:text-champagne-500 line-clamp-2">' + esc(job.title||'Untitled') + '</a>' +
            '<div class="text-[12px] text-cocoa-400 truncate mt-0.5">' + esc(job.company||'') + '</div>' +
          '</div>' +
          '<button class="icon-btn is-saved unsave" title="Remove" data-id="' + encodeURIComponent(id) + '"><span class="material-symbols-rounded" style="font-size:18px;">bookmark</span></button>' +
        '</div>' +
        '<div class="flex flex-wrap gap-1.5">' +
          (job.location_label ? '<span class="chip">' + esc(job.location_label) + '</span>' : '') +
          (job.salary ? '<span class="chip">' + esc(job.salary) + '</span>' : '') +
          '<span class="chip">' + esc((job.source_info && job.source_info.name) || job.source || '') + '</span>' +
        '</div>';
      list.appendChild(card);
    });
    list.querySelectorAll('.unsave').forEach(btn => btn.addEventListener('click', async () => {
      const id = decodeURIComponent(btn.getAttribute('data-id'));
      btn.disabled = true;
      try { await API.unsaveJob(id); toast('Removed from saved.'); render((await API.saved())); }
      catch (e) { toast(e.message || 'Could not remove.'); btn.disabled = false; }
    }));
  }

  API.saved().then(render).catch(() => {
    list.innerHTML = '<div class="md:col-span-2 xl:col-span-3 card p-10 text-center text-[13.5px] text-cocoa-500">Could not load your saved roles. Please try again.</div>';
  });
})();
</script>
<script src="nav.js"></script>
</body>
</html>
