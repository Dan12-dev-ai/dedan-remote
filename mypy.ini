# mypy configuration — the type contract enforced by CI (.github/workflows/ci.yml).
#
# Scope and flags live here so a bare `mypy` invocation reproduces the CI check
# exactly, the same way ruff.toml pins the lint contract. CI passes the same
# paths and flags explicitly.
#
# Scope: all application code (api, agents, config, core, database, intelligence,
# models, notifications, scrapers, utils, main.py). `tests/` is intentionally
# outside the type-checked scope — the suite relies on dynamic fixtures and
# monkeypatching; it is validated by pytest instead.
#
# NOTE: mypy must run in an environment where requirements.txt is installed.
# Without them (e.g. fastapi/pydantic missing) third-party types degrade to Any
# and genuine errors are silently hidden — a false green.

[mypy]
files = api, agents, config, core, database, intelligence, main.py, models, notifications, scrapers, utils
ignore_missing_imports = True
no_strict_optional = True
