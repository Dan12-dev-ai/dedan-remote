[pytest]
# ── Pytest Configuration — shared settings for the DEDAN Remote test suite ──

# Minimum pytest version
minversion = 8.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbose output
    -v
    # Show print statements
    -s
    # Show slowest 10 tests
    --durations=10
    # Parallel execution (with xdist)
    -n auto
    # Coverage
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    # Markers
    --strict-markers
    # Exit on first failure (optional, comment out for full run)
    # -x
    # Show local variables on failure
    -l
    # Capture output
    --capture=no

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    integration: Requires Docker containers (PostgreSQL, Redis)
    security: Security penetration tests
    property_based: Hypothesis property-based tests
    slow: Long-running tests (>5 seconds)
    asyncio: Async tests (requires pytest-asyncio)

# Asyncio mode (pytest-asyncio)
asyncio_mode = auto

# Timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
branch = True
# Each xdist worker writes its own .coverage.<host>.<pid>.<rand> data file and
# the controller combines them. Without `parallel`, workers race on a single
# .coverage file and the run dies with "unable to open database file".
parallel = True
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abc.abstractmethod

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG

# Hypothesis configuration (for property-based tests)
[hypothesis]
max_examples = 1000
deadline = 5000
